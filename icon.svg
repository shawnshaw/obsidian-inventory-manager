<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#2563eb"/>
  <!-- Box body -->
  <rect x="24" y="36" width="80" height="60" rx="8" fill="#f8fafc"/>
  <!-- Box lid/header -->
  <rect x="24" y="28" width="80" height="16" rx="6" fill="#1d4ed8"/>
  <!-- Lid top highlight -->
  <rect x="28" y="32" width="72" height="6" rx="3" fill="#3b82f6"/>
  <!-- Shelf lines -->
  <line x1="24" y1="61" x2="104" y2="61" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="78" x2="104" y2="78" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Items on shelves -->
  <rect x="30" y="42" width="14" height="14" rx="3" fill="#2563eb"/>
  <rect x="48" y="42" width="14" height="14" rx="3" fill="#93c5fd"/>
  <rect x="66" y="42" width="14" height="14" rx="3" fill="#2563eb"/>
  <rect x="84" y="42" width="14" height="14" rx="3" fill="#93c5fd"/>
  <!-- Bottom row items -->
  <rect x="30" y="65" width="14" height="10" rx="3" fill="#93c5fd"/>
  <rect x="57" y="65" width="14" height="10" rx="3" fill="#2563eb"/>
  <rect x="84" y="65" width="14" height="10" rx="3" fill="#93c5fd"/>
  <!-- Tag badge bottom-right -->
  <rect x="78" y="82" width="22" height="12" rx="6" fill="#dbeafe"/>
  <rect x="82" y="86" width="14" height="4" rx="2" fill="#2563eb"/>
</svg>
